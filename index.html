<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#171B1E"><title>Hangdog Logger</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"><style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.01em}
h1{font-size:34px;margin:4px 0 14px;line-height:1}
h2{font-size:24px;margin:20px 0 8px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);color:var(--accfg);border-color:transparent;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;background:none;flex:1}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.rt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.rt.sent{border-left:6px solid var(--acc)}
.rt.fl{border-left:6px solid var(--flash)}
.rt.pick{outline:3px solid var(--acc)}
.top{display:flex;gap:12px;align-items:center}
.chip{min-width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px;border:2px solid rgba(0,0,0,.18)}
.mid{flex:1;min-width:0}.mid b{display:block;font-size:19px}
small,.mute{color:var(--mute);font-size:14px}
.badge{font-weight:600;font-size:14px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.acts button[data-t="top"]{border-color:var(--acc)}
.acts button[data-t="flash"]{border-color:var(--flash)}
.mini{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px}
.mini button{border:0;background:none;padding:6px 0;min-height:36px;color:var(--mute);text-decoration:underline;font-size:14px}
.form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
label{display:block;font-weight:600;margin:10px 0 4px}
select,input[type=text],textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-height:44px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:44px;height:44px;border-radius:50%;padding:0;border:2px solid rgba(0,0,0,.2)}
.sw button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.hero{display:flex;gap:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .num{font-size:44px;line-height:1}
.bars{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.br{display:flex;align-items:center;gap:10px;margin:6px 0}
.br .g{width:48px;font-weight:600}
.trk{flex:1;height:22px;background:var(--bg);border-radius:6px;overflow:hidden;display:flex}
.trk i{display:block;height:100%}
.wk{display:flex;align-items:flex-end;gap:6px;height:90px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 8px}
.wk div{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:3px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;min-height:56px;font-weight:600;color:var(--mute)}
nav button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--acc)}
.empty{padding:28px 8px;text-align:center;color:var(--mute)}
.chk{display:flex;gap:8px;align-items:center;min-height:44px}
.chk input{width:22px;height:22px}
body{touch-action:manipulation}
#mb{touch-action:pan-x pan-y;overflow:auto;max-height:62vh;margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:14px}
#map{display:block;height:auto;user-select:none;-webkit-user-select:none}

.qb{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.18);padding:10px 12px;z-index:5}
.qb>div{max-width:560px;margin:0 auto}
.qh{display:flex;gap:10px;align-items:center}
.qb .acts{margin-top:8px}
.qb .acts button{min-height:52px;font-weight:600}
</style></head><body><main id="app"></main><nav id="nav" aria-label="Sections"></nav><script>
const $=id=>document.getElementById(id);

/* Position markers from the gym map (x, y on a 200 x 324 plan). L02, R13 and R16 were hidden on the source map, so those are estimates. */
const SL='L01 35.6 232.8;L02 35.2 219.8;L03 34.8 206.8;L04 35 190.6;L05 35 178.6;L06 47.8 184;L07 63.8 184;L08 77.4 166.6;L09 77.4 150;L10 64.8 129.2;L11 50 129.2;L12 41.6 124.2;L13 39.2 113.8;L14 39.2 91.8;L15 33.6 65.8;L16 27 48;L17 27 22.4;L18 41.4 31.2;L19 57.4 31.2;L20 72.6 31.2;R01 117.2 301.4;R02 126.6 301.4;R03 135.8 301.4;R04 144.8 301.4;R05 144.8 283.2;R06 144.8 265.2;R07 144.8 247.2;R08 144.8 229.2;R09 162.8 217.2;R10 163 190.2;R11 145.8 198.6;R12 125.2 182;R13 124 166;R14 125.2 149.8;R15 142.6 138.4;R16 152.2 132.4;R17 161.6 126.6;R18 137 115.8;R19 153 100.6'.split(';').map(s=>{const a=s.split(' ');return[a[0],+a[1],+a[2]]});

  const h=S.shapes.find(x=>x.id===selSh);if(!h)return '';

  return h.pts.map((q,i)=>`<circle data-h="v:${h.id}:${i}" cx="${q[0]}" cy="${q[1]}" r="3" style="fill:var(--acc);opacity:.85;cursor:grab"/>`).join('')+`<circle data-h="v:${h.id}:m" cx="${cx}" cy="${cy}" r="3.6" style="fill:var(--card);stroke:var(--acc);stroke-width:1.2;cursor:grab"/>`;

const DEFM=()=>SL.map(s=>({c:s[0],x:s[1],y:s[2]}));
/* Shared data (routes, markers, lines) comes from routes.json in the repository. Climbers' logs stay in their own browser. */
const AKEY='hangdog-admin',CKEY='hangdog-shared-cache';
if(location.hash==='#admin'){try{localStorage.setItem(AKEY,'1')}catch(e){}}
let BASE={routes:[],marks:DEFM(),lines:[],shapes:DEFSH(),labels:DEFLB(),community:{url:'',key:''}},PUBJ=JSON.stringify(BASE),ready=false;
function rd(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function load(){const lg=rd(LKEY),old=rd(KEY);return{routes:[],marks:DEFM(),lines:[],shapes:DEFSH(),labels:DEFLB(),community:{url:'',key:''},logs:(lg&&lg.logs)||(old&&old.logs)||[]}}

  try{localStorage.setItem(LKEY,JSON.stringify({logs:S.logs}))}catch(e){}

async function boot(){

  if(!d||!Array.isArray(d.routes))d=rd(CKEY);
  if(d&&Array.isArray(d.routes))BASE={routes:d.routes,marks:d.marks&&d.marks.length?d.marks:DEFM(),lines:d.lines||[],shapes:Array.isArray(d.shapes)?d.shapes:DEFSH(),labels:Array.isArray(d.labels)?d.labels:DEFLB(),community:d.community&&typeof d.community==='object'?d.community:{url:'',key:''}};

let S=load(),tab='map',retired=false,hideSent=false,newColor='red',msg='',selS=null,sel=null,z=1,lastG=8,pend=null,edit=false,selL=null,selSh=null,selLb=null,CAN=localStorage.getItem(AKEY)==='1',pmsg='',showEx=false;
const ZS=[1,1.6,2.4,3.4];
const app=$('app');
function best(id){let b=0;for(const l of S.logs)if(l.r===id)b=Math.max(b,RANK[l.t]);return b}

function chip(r){const c=COL[r.c]||COL.red;return `<div class="chip num" style="background:${c[0]};color:${c[1]}">${esc(gl(r.g))}</div>`}

function card(r){
  const b=best(r.id),n=tries(r.id),st=b===3?'Flash':b===2?'Top':n?'Tried':'';
  return `<div class="rt ${b===3?'fl':b===2?'sent':''}${sel===r.id?' pick':''}"><div class="top">${chip(r)}<div class="mid"><b>${esc(r.p||'No position')}</b><small>${esc(r.c)} · set ${esc(r.d)}${n?` · ${n} log${n>1?'s':''}`:''}</small></div><span class="badge">${st}</span></div>

}

/* ---- Community: opt-in shared feed and leaderboard (needs a free Supabase table, see community-setup.sql) ---- */
const LIVE=false; /* set to true once the community database is ready */
const MKEY='hangdog-me',OKEY='hangdog-outbox';
let ME=rd(MKEY)||{dev:uid()+uid(),nick:'',on:false},OUT=rd(OKEY)||[],CD=null,cMsg='',cLoading=false,lbMode='month';
function saveMe(){try{localStorage.setItem(MKEY,JSON.stringify(ME))}catch(e){}}
saveMe();
const cOK=()=>LIVE&&!!(S.community&&S.community.url&&S.community.key);
const cUrl=()=>S.community.url.replace(/\/+$/,'')+'/rest/v1/ticks';
const cHdr=()=>({apikey:S.community.key,Authorization:'Bearer '+S.community.key,'Content-Type':'application/json'});
async function cFlush(){
  if(!cOK()||!OUT.length)return;
  try{
    const r=await fetch(cUrl()+'?on_conflict=device,route',{method:'POST',headers:{...cHdr(),Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify(OUT)});
    if(r.ok){OUT=[];try{localStorage.setItem(OKEY,'[]')}catch(e){}}

async function cLoad(){
  if(!cOK())return;

  try{
    const r=await fetch(cUrl()+'?select=ts,nick,device,grade,colour,marker,kind&order=ts.desc&limit=2000',{headers:cHdr()});

const ago=t=>{const m=Math.round((Date.now()-new Date(t))/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
function lb(){
  const now=new Date(),m0=new Date(now.getFullYear(),now.getMonth(),1).getTime(),by={};
  for(const e of CD||[]){
    if(lbMode==='month'&&new Date(e.ts).getTime()<m0)continue;
    const o=by[e.device]||(by[e.device]={nick:e.nick,n:0,pts:0,hard:0,dev:e.device});
    o.n++;o.pts+=Math.max(1,e.grade-9)*(e.kind==='flash'?1.25:1);o.hard=Math.max(o.hard,e.grade);

  return Object.values(by).map(o=>({...o,pts:Math.round(o.pts)})).sort((a,b)=>b.pts-a.pts||b.n-a.n);
}
function viewCommunity(){
  let h='<h1>Community</h1>';
  if(!LIVE)return h+'<div class="form" style="text-align:center"><b>Coming soon</b><p class="mute" style="margin:6px 0 0">A gym leaderboard and a feed of what climbers have ticked are on the way.</p></div>';
  if(!cOK())return h+`<div class="empty">${CAN?'The community feed isn’t set up yet. Add your database details in Settings.':'The community feed isn’t switched on at this gym yet.'}</div>`;
  if(!ME.on||!ME.nick)h+=`<div class="form"><b>Join the community</b><p class="mute" style="margin:4px 0">Share your tops and flashes with the gym. Only your nickname, the route’s grade, colour and position are shared. Ticks you log from now on are included.</p><label for="nick">Nickname</label><input type="text" id="nick" maxlength="20" value="${esc(ME.nick)}" placeholder="e.g. Chalky"><div class="row" style="margin-top:12px"><button class="pri sp" data-a="join">Share my ticks</button></div></div>`;
  h+=`<div class="row" style="margin-top:12px"><h2 class="sp" style="margin:0">Leaderboard</h2><div class="seg" style="min-width:200px"><button data-a="lbm" data-m="month" aria-pressed="${lbMode==='month'}">This month</button><button data-a="lbm" data-m="all" aria-pressed="${lbMode==='all'}">All time</button></div></div>`;
  if(cMsg)h+=`<p class="mute" role="status">${esc(cMsg)}</p>`;

const DIRS={R:[1,0],L:[-1,0],D:[0,1],U:[0,-1]};
/* Place each marker's routes as a line of dots, choosing a direction that avoids other markers and dots. */
const DOT=4.8; /* route icon radius on the 200-wide map (2x the old size; the map also opens at a 1.6x zoom) */
function layout(){

}

/* Weekly average grade of first sends: tops include flashes, flashes are flash-first sends only. */
function trend(){
  const now=Date.now(),W=7*864e5,N=12,f=Array.from({length:N},()=>[]),t=Array.from({length:N},()=>[]);
  for(const r of S.routes){const s=firstSend(r.id);if(s===null)continue;const i=N-1-Math.floor((now-s)/W);if(i<0)continue;t[i].push(r.g);if(best(r.id)===3)f[i].push(r.g)}
  const av=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  return [f.map(av),t.map(av)];
}
function chart(){
  const [f,t]=trend(),all=[...f,...t].filter(v=>v!==null);
  if(!all.length)return '';
  const lo=Math.max(0,Math.floor(Math.min(...all))-1);let hi=Math.min(GR.length-1,Math.ceil(Math.max(...all))+1);if(hi<=lo)hi=lo+1;
  const N=12,px=i=>34+i*(274/(N-1)),py=v=>130-(v-lo)/(hi-lo)*118,step=hi-lo>8?2:1;
  let g='';
  for(let v=lo;v<=hi;v+=step)g+=`<line x1="34" x2="308" y1="${py(v)}" y2="${py(v)}" style="stroke:var(--line)"/><text x="28" y="${py(v)+3.5}" text-anchor="end" font-size="10" style="fill:var(--mute)">${gl(v)}</text>`;
  const ser=(a,col)=>{let d='',pen=false;a.forEach((v,i)=>{if(v===null){pen=false;return}d+=(pen?'L':'M')+px(i).toFixed(1)+' '+py(v).toFixed(1);pen=true});return `<path d="${d}" fill="none" stroke-width="2.5" stroke-linejoin="round" style="stroke:${col}"/>`+a.map((v,i)=>v===null?'':`<circle cx="${px(i).toFixed(1)}" cy="${py(v).toFixed(1)}" r="3.5" style="fill:${col}"/>`).join('')};
  return `<h2>Average grade over time</h2><div class="bars"><svg viewBox="0 0 320 156" style="width:100%;height:auto" role="img" aria-label="Average grade of tops and flashes per week">${g}${ser(t,'var(--acc)')}${ser(f,'var(--flash)')}<text x="34" y="150" font-size="10" style="fill:var(--mute)">12 weeks ago</text><text x="308" y="150" text-anchor="end" font-size="10" style="fill:var(--mute)">this week</text></svg><small><span style="color:var(--acc)">●</span> Tops (including flashes) &nbsp; <span style="color:var(--flash)">●</span> Flashes<br>Each route counts in the week you first sent it. Gaps mean no sends that week.</small></div>`;
}
function viewStats(){
  const sent=S.routes.filter(r=>best(r.id)>1);
  if(!S.logs.length)return `<h1>Progress</h1><div class="empty">Log a few climbs and your grade breakdown will show up here.</div>`;
  const flashes=sent.filter(r=>best(r.id)===3).length;
  const hard=sent.length?Math.max(...sent.map(r=>r.g)):null;
  let h=`<h1>Progress</h1><div class="hero"><div class="stat"><div class="num">${sent.length}</div><small>routes sent</small></div><div class="stat"><div class="num">${hard===null?'–':esc(gl(hard))}</div><small>hardest send</small></div><div class="stat"><div class="num">${flashes}</div><small>flashes</small></div></div>`;
  const by={};
  for(const r of S.routes){const b=best(r.id);if(!b)continue;const o=by[r.g]||(by[r.g]={f:0,t:0,a:0});if(b===3)o.f++;else if(b===2)o.t++;else o.a++}
  const gs=Object.keys(by).map(Number).sort((a,b)=>b-a);
  const mx=Math.max(1,...gs.map(g=>by[g].f+by[g].t+by[g].a));
  h+=chart()+`<h2>Routes by grade</h2><div class="bars">${gs.map(g=>{const o=by[g],w=v=>(v/mx*100).toFixed(1)+'%';return `<div class="br"><span class="g num">${esc(gl(g))}</span><div class="trk"><i style="width:${w(o.f)};background:var(--flash)"></i><i style="width:${w(o.t)};background:var(--acc)"></i><i style="width:${w(o.a)};background:var(--line)"></i></div><span>${o.f+o.t+o.a}</span></div>`}).join('')}<small>Yellow flash · blue top · grey tried only</small></div>`;
  const now=Date.now(),W=7*864e5,wk=Array(8).fill(0);
  for(const r of sent){const t=firstSend(r.id);if(t===null)continue;const i=Math.floor((now-t)/W);if(i>=0&&i<8)wk[7-i]++}
  const wm=Math.max(1,...wk);
  h+=`<h2>New sends, last 8 weeks</h2><div class="wk" role="img" aria-label="New sends per week: ${wk.join(', ')}">${wk.map(v=>`<div style="height:${Math.max(4,v/wm*100)}%" title="${v}"></div>`).join('')}</div><small>Oldest week on the left. Each route counts once, in the week you first sent it.</small>`;
  return h;
}

  else if(a==='dels'){if(pend==='dels'){S.shapes=S.shapes.filter(x=>x.id!==selSh);selSh=null;pend=null;save()}else pend='dels'}
  else if(a==='addv'){const h=S.shapes.find(x=>x.id===selSh);if(h){let bi=0,bl=-1;h.pts.forEach((q,i)=>{const w=h.pts[(i+1)%h.pts.length],l=Math.hypot(q[0]-w[0],q[1]-w[1]);if(l>bl){bl=l;bi=i}});const q=h.pts[bi],w=h.pts[(bi+1)%h.pts.length];h.pts.splice(bi+1,0,[+((q[0]+w[0])/2).toFixed(1),+((q[1]+w[1])/2).toFixed(1)]);save()}}
  else if(a==='lnr'){const l=LNS();if(l.id){delete l.col;save()}}
  else if(a==='lbr'){const l=LBS();if(l.id){delete l.col;save()}}
  else if(a==='shr'){const h=S.shapes.find(x=>x.id===selSh);if(h){delete h.col;delete h.op;save()}}
  else if(a==='delv'){const h=S.shapes.find(x=>x.id===selSh);if(h&&h.pts.length>3){h.pts.pop();save()}}
  else if(a==='addt'){const t=$('nt').value.trim().slice(0,24);if(t){const l={id:uid(),t,x:100,y:162};S.labels.push(l);selLb=l.id;selSh=null;selL=null;save()}}
  else if(a==='delt'){if(pend==='delt'){S.labels=S.labels.filter(x=>x.id!==selLb);selLb=null;pend=null;save()}else pend='delt'}
  else if(a==='edit'){edit=!edit;selL=null;selSh=null;selLb=null}
  else if(a==='sell'){selL=id;selSh=null;selLb=null}
  else if(a==='addm'){const c=$('nc').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);if(c&&!S.marks.some(m=>m.c===c)){S.marks.push({c,x:100,y:162});selS=c;save()}}
  else if(a==='addl'){const l={id:uid(),x1:70,y1:162,x2:130,y2:162};S.lines.push(l);selL=l.id;save()}
  else if(a==='dell'){if(pend==='dell'){S.lines=S.lines.filter(l=>l.id!==selL);selL=null;pend=null;save()}else pend='dell'}
  else if(a==='delm'){if(!S.routes.some(r=>r.p===selS)){if(pend==='delm'){S.marks=S.marks.filter(m=>m.c!==selS);selS=null;pend=null;save()}else pend='delm'}}
  else return;
  render();
  if(a==='sels'){const p=$('sp');if(p)p.scrollIntoView({block:'start'})}
});
document.addEventListener('change',e=>{
  const a=e.target.dataset.a;
  if(a==='hide'){hideSent=e.target.checked;render()}
  else if(CAN&&a==='shk'){const h=S.shapes.find(x=>x.id===selSh);if(h){h.k=e.target.value;save();render()}}
  else if(CAN&&a==='lnc'){const l=LNS();if(l.id){l.col=e.target.value;save();render()}}
  else if(CAN&&a==='lbc'){const l=LBS();if(l.id){l.col=e.target.value;save();render()}}
  else if(CAN&&a==='shc'){const h=SHS();if(h.id){h.col=e.target.value;save();render()}}
  else if(CAN&&a==='sho'){const h=SHS();if(h.id){h.op=+e.target.value/100;save();render()}}
  else if(CAN&&a==='rnt'){const l=S.labels.find(x=>x.id===selLb);if(l){l.t=e.target.value.trim().slice(0,24)||l.t;save();render()}}
  else if(CAN&&a==='rnm'){const c=e.target.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6),m=S.marks.find(x=>x.c===selS);if(m&&c&&!S.marks.some(x=>x.c===c)){S.routes.forEach(r=>{if(r.p===selS)r.p=c});m.c=c;selS=c;save()}render()}
  else if(a==='snick'){ME.nick=e.target.value.trim().replace(/[<>]/g,'').slice(0,20);if(!ME.nick)ME.on=false;saveMe();render()}
  else if(a==='cshare'){ME.on=e.target.checked&&!!ME.nick;saveMe();render()}
  else if(CAN&&a==='curl'){S.community.url=e.target.value.trim();save();render()}
  else if(CAN&&a==='ckey'){S.community.key=e.target.value.trim();save();render()}
});
let drag=null;
const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
function pt(e){const s=$('map'),p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(s.getScreenCTM().inverse())}
document.addEventListener('pointerdown',e=>{
  if(!edit)return;const h=e.target.closest('[data-h]');if(!h)return;
  const q=h.dataset.h.split(':'),k=q[0],o=k==='m'?S.marks.find(m=>m.c===q[1]):k==='a'?S.lines.find(l=>l.id===q[1]):k==='v'?S.shapes.find(x=>x.id===q[1]):S.labels.find(x=>x.id===q[1]);
  if(!o)return;drag={k,e:q[2],o,s:JSON.parse(JSON.stringify(o)),p:pt(e)};if(k==='m')selS=q[1];else if(k==='a')selL=q[1];else if(k==='v')selSh=q[1];else selLb=q[1];
  $('map').setPointerCapture(e.pointerId);e.preventDefault()});
document.addEventListener('pointermove',e=>{
  if(!drag)return;const p=pt(e),o=drag.o,s=drag.s;
  if(drag.k==='t'){o.x=clamp(s.x+p.x-drag.p.x,2,198);o.y=clamp(s.y+p.y-drag.p.y,4,322)}
  else if(drag.k==='v'){if(drag.e==='m'){const dx=p.x-drag.p.x,dy=p.y-drag.p.y;o.pts=s.pts.map(q=>[+(q[0]+dx).toFixed(1),+(q[1]+dy).toFixed(1)])}else o.pts[+drag.e]=[+clamp(p.x,0,200).toFixed(1),+clamp(p.y,0,324).toFixed(1)]}
  else if(drag.k==='m'){o.x=clamp(s.x+p.x-drag.p.x,6,194);o.y=clamp(s.y+p.y-drag.p.y,4,320)}
  else if(drag.e==='1'){o.x1=clamp(p.x,3,197);o.y1=clamp(p.y,3,321)}
  else if(drag.e==='2'){o.x2=clamp(p.x,3,197);o.y2=clamp(p.y,3,321)}
  else{const dx=clamp(p.x-drag.p.x,3-Math.min(s.x1,s.x2),197-Math.max(s.x1,s.x2)),dy=clamp(p.y-drag.p.y,3-Math.min(s.y1,s.y2),321-Math.max(s.y1,s.y2));o.x1=s.x1+dx;o.x2=s.x2+dx;o.y1=s.y1+dy;o.y2=s.y2+dy}
  $('map').innerHTML=mapInner()});
const endDrag=()=>{if(drag){drag=null;save();render()}};
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
render();
boot();
</script></body></html>
